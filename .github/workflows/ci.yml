name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev --extra pdf

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Black
        run: uv run --no-sync black --check .

      - name: Mypy
        run: uv run --no-sync mypy structmd

      - name: Bandit (medium+ severities)
        run: uv run --no-sync bandit -r structmd -q

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev --extra pdf

      - name: Run tests
        run: uv run --no-sync pytest -q

      # The suite is fully offline: Ollama HTTP traffic is mocked with respx,
      # extraction stubs replace the VLM, and fixtures are generated locally.
      # No Ollama server is required (or used) in CI.

  test-integration:
    name: Integration (LibreOffice / Office converters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev --extra all

      - name: Run full suite (office tests included)
        run: uv run --no-sync pytest -q
