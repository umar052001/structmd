[project]
name = "structmd"
version = "0.1.0"
description = "Convert PDFs, Office documents, and images into structured Markdown using small VLMs via Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "structmd contributors" }]
keywords = ["markdown", "pdf", "ocr", "ollama", "vlm", "document-conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=9.0.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
vlm = []
pdf = ["PyMuPDF>=1.23.0"]
office = ["PyMuPDF>=1.23.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML",
]
all = ["PyMuPDF>=1.23.0"]

[project.scripts]
structmd = "structmd.cli:main"

[project.urls]
Homepage = "https://github.com/umar052001/structmd"
Documentation = "https://umar052001.github.io/structmd/"
Repository = "https://github.com/umar052001/structmd"
Issues = "https://github.com/umar052001/structmd/issues"
Changelog = "https://github.com/umar052001/structmd/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["structmd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "UP006",  # keep typing.List/Dict for 3.9 compat
    "UP007",  # keep Optional[X] for 3.9 compat
    "UP035",  # keep typing imports for 3.9 compat
    "UP045",  # keep Optional[X] for 3.9 compat
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[dependency-groups]
dev = [
    "types-tqdm>=4.67.3.20260205",
]
